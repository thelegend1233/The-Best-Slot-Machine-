# wrangler.toml — Cloudflare Worker config for the Norminton Casino backend.
#
# Deploy (after first run of `wrangler login` on your account):
#     cd backend
#     wrangler deploy
#
# Local dev server (no Cloudflare account needed to just try it):
#     wrangler dev
# hits http://127.0.0.1:8787 with Durable Objects simulated locally.

name = "norminton-casino"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Cloudflare account ID — not a secret (it's a public routing identifier).
# Pulled from `wrangler whoami` on the owning account.
account_id = "1e86782c2fdb02f2cdd63affb1008808"

# Durable Object that owns per-table state (RNG, evaluator, spin log).
[[durable_objects.bindings]]
name = "TABLE"
class_name = "Table"

# Tells wrangler "this worker now owns a Durable Object class called
# Table"; required on first deploy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table"]

[observability]
enabled = true

# D1 spin log database.
# 1. Run:  wrangler d1 create norminton-casino-db
# 2. Copy the database_id from the output and paste it below.
# 3. Run:  wrangler d1 execute norminton-casino-db --file=migrations/0001_spin_log.sql
# 4. Run:  wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "norminton-casino-db"
database_id = "REPLACE_WITH_YOUR_DB_ID"

[dev]
port = 8787
