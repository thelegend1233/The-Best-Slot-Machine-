<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norminton Casino — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1b2a;
      color: #e8dcc8;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #1e2d3d;
    }

    .brand-mark {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #b8860b, #daa520);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: #0d1b2a;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; }

    .status {
      font-size: 0.78rem;
      margin-top: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #8a9bb0;
    }
    .status::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #8a9bb0;
      flex-shrink: 0;
    }
    .status.connected { color: #4caf50; }
    .status.connected::before { background: #4caf50; }
    .status.disconnected { color: #e05252; }
    .status.disconnected::before { background: #e05252; }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .header-stats { display: flex; gap: 2rem; text-align: right; }
    .stat-block .val { font-size: 1.5rem; font-weight: 700; }
    .stat-block .lbl { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: #8a9bb0; margin-top: 0.1rem; }

    .reset-btn {
      padding: 0.5rem 1.1rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: #8b1a1a;
      border: 1px solid #b02020;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .reset-btn:hover { background: #a01e1e; }
    .reset-btn:active { background: #6e1414; }

    /* ── Section ── */
    .section { margin-bottom: 2.5rem; }
    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8a9bb0;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #1e2d3d;
    }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      padding: 0.6rem 1rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8a9bb0;
      border-bottom: 1px solid #1e2d3d;
      white-space: nowrap;
    }
    th.r { text-align: right; }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #121f2d;
      font-size: 0.92rem;
      white-space: nowrap;
    }
    td.r { text-align: right; font-variant-numeric: tabular-nums; }

    tr:hover td { background: #131f2e; }

    .rank { color: #8a9bb0; font-size: 0.8rem; width: 2rem; }

    .positive { color: #4caf50; font-weight: 600; }
    .negative { color: #e05252; font-weight: 600; }
    .neutral  { color: #8a9bb0; }

    .empty-row td {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #8a9bb0;
      font-style: italic;
    }

    .updated {
      margin-top: 0.75rem;
      font-size: 0.72rem;
      color: #8a9bb0;
      text-align: right;
    }
  </style>
</head>
<body>

<header>
  <div class="brand-mark">N</div>
  <div class="header-text">
    <h1>Norminton Casino — Dashboard</h1>
    <p class="status" id="status">Connecting…</p>
  </div>
  <div class="header-right">
    <div class="header-stats">
      <div class="stat-block">
        <div class="val" id="stat-players">0</div>
        <div class="lbl">In Session</div>
      </div>
      <div class="stat-block">
        <div class="val" id="stat-spins">0</div>
        <div class="lbl">Session Spins</div>
      </div>
      <div class="stat-block">
        <div class="val" id="stat-wagered">0.00</div>
        <div class="lbl">Session Wagered</div>
      </div>
    </div>
    <button class="reset-btn" id="reset-btn">Reset Session</button>
  </div>
</header>

<!-- Current Session -->
<div class="section">
  <div class="section-title">Current Session</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="rank r">#</th>
          <th>Player</th>
          <th class="r">Balance</th>
          <th class="r">Session Net</th>
          <th class="r">Wagered</th>
          <th class="r">Won</th>
          <th class="r">Spins</th>
        </tr>
      </thead>
      <tbody id="session-body">
        <tr class="empty-row"><td colspan="7">No players in this session yet…</td></tr>
      </tbody>
    </table>
  </div>
  <p class="updated" id="updated"></p>
</div>

<!-- All-Time History -->
<div class="section">
  <div class="section-title">All-Time History</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="rank r">#</th>
          <th>Player</th>
          <th class="r">Sessions</th>
          <th class="r">All-Time Net</th>
          <th class="r">Total Wagered</th>
          <th class="r">Total Won</th>
        </tr>
      </thead>
      <tbody id="alltime-body">
        <tr class="empty-row"><td colspan="6">No history yet…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const BACKEND_URL = "https://norminton-casino.nicholas-1e8.workers.dev";

  const statusEl   = document.getElementById("status");
  const sessionEl  = document.getElementById("session-body");
  const allTimeEl  = document.getElementById("alltime-body");
  const updatedEl  = document.getElementById("updated");

  function fmt(n) { return Number(n || 0).toFixed(2); }

  function netCell(n) {
    const sign = n > 0.005 ? "+" : "";
    const cls  = n > 0.005 ? "positive" : n < -0.005 ? "negative" : "neutral";
    return `<td class="r ${cls}">${sign}${fmt(n)}</td>`;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderSession(players) {
    const totalSpins   = players.reduce((s, p) => s + (p.totalSpins || 0), 0);
    const totalWagered = players.reduce((s, p) => s + (p.totalWagered || 0), 0);
    document.getElementById("stat-players").textContent  = players.length;
    document.getElementById("stat-spins").textContent    = totalSpins.toLocaleString();
    document.getElementById("stat-wagered").textContent  = fmt(totalWagered);

    if (!players.length) {
      sessionEl.innerHTML = '<tr class="empty-row"><td colspan="7">No players in this session yet…</td></tr>';
      return;
    }

    sessionEl.innerHTML = players.map((p, i) => {
      const net = (p.balance || 0) - (p.buyIn || 0);
      return `<tr>
        <td class="rank r">${i + 1}</td>
        <td>${esc(p.displayName)}</td>
        <td class="r">${fmt(p.balance)}</td>
        ${netCell(net)}
        <td class="r">${fmt(p.totalWagered)}</td>
        <td class="r">${fmt(p.totalWon)}</td>
        <td class="r">${(p.totalSpins || 0).toLocaleString()}</td>
      </tr>`;
    }).join("");

    updatedEl.textContent = "Updated " + new Date().toLocaleTimeString();
  }

  function renderAllTime(players) {
    if (!players.length) {
      allTimeEl.innerHTML = '<tr class="empty-row"><td colspan="6">No history yet…</td></tr>';
      return;
    }

    allTimeEl.innerHTML = players.map((p, i) => {
      const net = (p.allTimeWon || 0) - (p.allTimeWagered || 0);
      return `<tr>
        <td class="rank r">${i + 1}</td>
        <td>${esc(p.displayName)}</td>
        <td class="r">${p.sessionsPlayed || 0}</td>
        ${netCell(net)}
        <td class="r">${fmt(p.allTimeWagered)}</td>
        <td class="r">${fmt(p.allTimeWon)}</td>
      </tr>`;
    }).join("");
  }

  function onLeaderboard(msg) {
    statusEl.textContent = "Connected";
    statusEl.className = "status connected";
    renderSession(msg.session || []);
    renderAllTime(msg.allTime || []);
  }

  let _ws = null;

  document.getElementById("reset-btn").addEventListener("click", () => {
    if (!_ws || _ws.readyState !== WebSocket.OPEN) return;
    if (!confirm("Reset all player balances? Everyone will need to buy in again.")) return;
    _ws.send(JSON.stringify({ type: "host-reset" }));
  });

  function connect() {
    const wsUrl = BACKEND_URL.replace(/^http/, "ws").replace(/\/?$/, "") + "/ws";
    const ws = new WebSocket(wsUrl);
    _ws = ws;

    ws.addEventListener("open", () => {
      ws.send(JSON.stringify({ type: "host-join" }));
      statusEl.textContent = "Connected — waiting for data…";
      statusEl.className = "status connected";
    });

    ws.addEventListener("message", (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      console.log("[dashboard] received:", msg.type, msg);
      if (msg.type === "leaderboard") onLeaderboard(msg);
      else if (msg.type === "reset")  { renderSession([]); renderAllTime([]); }
      else if (msg.type === "error")  {
        statusEl.textContent = "Server error: " + msg.error;
        statusEl.className = "status disconnected";
      }
    });

    ws.addEventListener("close", () => {
      statusEl.textContent = "Disconnected — reconnecting…";
      statusEl.className = "status disconnected";
      setTimeout(connect, 3000);
    });

    ws.addEventListener("error", () => {
      statusEl.textContent = "Connection error";
      statusEl.className = "status disconnected";
    });
  }

  connect();
</script>
</body>
</html>
