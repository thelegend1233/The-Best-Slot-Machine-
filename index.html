<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slot Machine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="machine">
    <h1 class="title">Wildwood Spins</h1>

    <!-- 5 reels, 3 rows. Each cell is filled in by game.js. -->
    <div class="grid" id="grid">
      <div class="reel" data-reel="0">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="1">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="2">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="3">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="4">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
    </div>

    <div class="controls">
      <button id="spin-button" type="button" class="spin-button">Spin</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
