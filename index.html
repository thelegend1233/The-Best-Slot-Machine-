<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norminton Casino</title>
  <link rel="stylesheet" href="style.css?v=13" />
</head>
<body>
  <main class="machine">
    <header class="brand">
      <span class="brand-mark">N</span>
      <div class="brand-text">
        <h1 class="title">Norminton Casino</h1>
        <p class="tagline">House of Wildwood Spins</p>
      </div>
    </header>

    <!-- 5 reels, 3 rows. Each cell is filled in by game.js. -->
    <div class="grid" id="grid">
      <div class="reel" data-reel="0">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="1">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="2">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="3">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="4">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
    </div>

    <div class="bonus-indicator" id="bonus-indicator" hidden>
      <div class="bonus-item">
        <span class="bonus-label">Free Spins</span>
        <span class="bonus-value"><span id="bonus-remaining">10</span> / <span id="bonus-total">10</span></span>
      </div>
      <div class="bonus-item">
        <span class="bonus-label">Multiplier</span>
        <span class="bonus-value">×<span id="bonus-multiplier">2</span></span>
      </div>
      <div class="bonus-item">
        <span class="bonus-label">Bonus Win</span>
        <span class="bonus-value" id="bonus-total-win">0.00</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Balance</span>
        <span class="stat-value" id="balance">0.00</span>
      </div>
      <div class="stat stat-win">
        <span class="stat-label">Win</span>
        <span class="stat-value" id="win">0.00</span>
      </div>
    </div>

    <div class="bet-controls">
      <div class="bet-group">
        <span class="bet-label">Bet</span>
        <div class="stepper">
          <button class="stepper-btn" data-action="bet-down" type="button" aria-label="Decrease bet">−</button>
          <span class="stepper-value" id="bet">0.00</span>
          <button class="stepper-btn" data-action="bet-up" type="button" aria-label="Increase bet">+</button>
        </div>
      </div>

      <div class="bet-group">
        <span class="bet-label">Ways</span>
        <span class="ways-value">243</span>
      </div>
    </div>

    <div class="controls">
      <button id="spin-button" type="button" class="spin-button">Spin</button>
      <button id="buy-back-in-button" type="button" class="buy-back-in-button">Buy Back In</button>
    </div>
  </main>

  <!-- Full-screen overlay for the big-win celebration. Sits above everything
       and stays pointer-events: none so taps still reach the Spin button. -->
  <div class="celebration" aria-hidden="true">
    <div class="particles" id="particles"></div>
    <div class="big-win-banner" id="big-win-banner">BIG WIN</div>
    <div class="bonus-banner" id="bonus-banner" hidden>
      <div class="bonus-banner-title" id="bonus-banner-title">FREE SPINS</div>
      <div class="bonus-banner-sub" id="bonus-banner-sub">10 × 2</div>
    </div>
  </div>

  <script src="game.js?v=14"></script>
</body>
</html>
