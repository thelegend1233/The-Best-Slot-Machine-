<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norminton Casino</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <main class="machine">
    <header class="brand">
      <span class="brand-mark">N</span>
      <div class="brand-text">
        <h1 class="title">Norminton Casino</h1>
        <p class="tagline">House of Wildwood Spins</p>
      </div>
    </header>

    <!-- 5 reels, 3 rows. Each cell is filled in by game.js. -->
    <div class="grid" id="grid">
      <div class="reel" data-reel="0">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="1">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="2">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="3">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="4">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Balance</span>
        <span class="stat-value" id="balance">0.00</span>
      </div>
      <div class="stat stat-win">
        <span class="stat-label">Win</span>
        <span class="stat-value" id="win">0.00</span>
      </div>
    </div>

    <div class="bet-controls">
      <div class="bet-group">
        <span class="bet-label">Line Bet</span>
        <div class="stepper">
          <button class="stepper-btn" data-action="bet-down" type="button" aria-label="Decrease line bet">−</button>
          <span class="stepper-value" id="line-bet">0.00</span>
          <button class="stepper-btn" data-action="bet-up" type="button" aria-label="Increase line bet">+</button>
        </div>
      </div>

      <div class="bet-group">
        <span class="bet-label">Lines</span>
        <div class="stepper">
          <button class="stepper-btn" data-action="lines-down" type="button" aria-label="Decrease active lines">−</button>
          <span class="stepper-value" id="active-lines">0</span>
          <button class="stepper-btn" data-action="lines-up" type="button" aria-label="Increase active lines">+</button>
        </div>
      </div>

      <div class="bet-group bet-total">
        <span class="bet-label">Total Bet</span>
        <span class="bet-total-value" id="total-bet">0.00</span>
      </div>
    </div>

    <div class="controls">
      <button id="spin-button" type="button" class="spin-button">Spin</button>
    </div>
  </main>

  <script src="game.js?v=5"></script>
</body>
</html>
