<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norminton Casino</title>
  <link rel="stylesheet" href="style.css?v=19" />
  <!-- Howler.js handles audio playback, cross-browser quirks, and iOS
       unlock-on-first-touch. Loaded from CDN so there's no build step. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>
  <main class="machine">
    <header class="brand">
      <span class="brand-mark">N</span>
      <div class="brand-text">
        <h1 class="title">Norminton Casino</h1>
        <p class="tagline">House of Wildwood Spins</p>
      </div>
    </header>

    <!-- 5 reels, 3 rows. Each cell is filled in by game.js. -->
    <div class="grid" id="grid">
      <div class="reel" data-reel="0">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="1">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="2">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="3">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="4">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
    </div>

    <div class="bonus-indicator" id="bonus-indicator" hidden>
      <div class="bonus-item">
        <span class="bonus-label">Free Spins</span>
        <span class="bonus-value"><span id="bonus-remaining">10</span> / <span id="bonus-total">10</span></span>
      </div>
      <div class="bonus-item">
        <span class="bonus-label">Multiplier</span>
        <span class="bonus-value">×<span id="bonus-multiplier">2</span></span>
      </div>
      <div class="bonus-item">
        <span class="bonus-label">Bonus Win</span>
        <span class="bonus-value" id="bonus-total-win">0.00</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Balance</span>
        <span class="stat-value" id="balance">0.00</span>
      </div>
      <div class="stat stat-win">
        <span class="stat-label">Win</span>
        <span class="stat-value" id="win">0.00</span>
      </div>
    </div>

    <div class="bet-controls">
      <div class="bet-group">
        <span class="bet-label">Bet</span>
        <div class="stepper">
          <button class="stepper-btn" data-action="bet-down" type="button" aria-label="Decrease bet">−</button>
          <span class="stepper-value" id="bet">0.00</span>
          <button class="stepper-btn" data-action="bet-up" type="button" aria-label="Increase bet">+</button>
        </div>
      </div>

      <div class="bet-group">
        <span class="bet-label">Ways</span>
        <span class="ways-value">243</span>
      </div>
    </div>

    <div class="controls">
      <button id="spin-button" type="button" class="spin-button">Spin</button>
      <button id="buy-back-in-button" type="button" class="buy-back-in-button">Buy Back In</button>
    </div>
  </main>

  <!-- Full-screen overlay for the big-win celebration. Sits above everything
       and stays pointer-events: none so taps still reach the Spin button. -->
  <div class="celebration" aria-hidden="true">
    <div class="particles" id="particles"></div>
    <div class="big-win-banner" id="big-win-banner">BIG WIN</div>
    <div class="bonus-banner" id="bonus-banner" hidden>
      <div class="bonus-banner-title" id="bonus-banner-title">FREE SPINS</div>
      <div class="bonus-banner-sub" id="bonus-banner-sub">10 × 2</div>
    </div>
  </div>

  <!-- Mute button — fixed top-left so it's always reachable on mobile. -->
  <button type="button" class="mute-button" id="mute-button" aria-label="Mute audio">🔊</button>

  <!-- Bonus wheels overlay — shown only when a bonus is triggered. -->
  <div class="wheel-overlay" id="wheel-overlay" hidden aria-hidden="true">
    <div class="wheel-stage">
      <h2 class="wheel-title" id="wheel-title">Multiplier Wheel</h2>
      <div class="wheel-wrap">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <svg class="wheel" id="wheel" viewBox="-110 -110 220 220"></svg>
        <div class="wheel-result" id="wheel-result"></div>
      </div>
      <button type="button" class="wheel-button" id="wheel-button">Spin</button>
    </div>
  </div>

  <!-- Dev panel — only revealed when the URL contains ?dev=1. Hidden in
       normal play so it never distracts the user. -->
  <div class="dev-panel" id="dev-panel" hidden>
    <button type="button" class="dev-button" id="dev-force-bonus">Force Bonus</button>
    <div class="house-stats" id="house-stats" aria-live="polite">
      <div class="house-title">House Ledger</div>
      <div class="house-row"><span>Wagered</span><span id="hs-wagered">0.00</span></div>
      <div class="house-row"><span>Paid out</span><span id="hs-won">0.00</span></div>
      <div class="house-row"><span>Net house</span><span id="hs-net">0.00</span></div>
      <div class="house-row"><span>RTP</span><span id="hs-rtp">—</span></div>
      <div class="house-row"><span>Spins</span><span id="hs-spins">0</span></div>
      <div class="house-row"><span>Bonuses</span><span id="hs-bonuses">0</span></div>
      <button type="button" class="dev-button dev-button-sm" id="hs-reset">Reset Ledger</button>
    </div>
  </div>

  <script src="game.js?v=23"></script>
</body>
</html>
