<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norminton Casino</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main class="machine">
    <header class="brand">
      <span class="brand-mark">N</span>
      <div class="brand-text">
        <h1 class="title">Norminton Casino</h1>
        <p class="tagline">House of Wildwood Spins</p>
      </div>
    </header>

    <!-- 5 reels, 3 rows. Each cell is filled in by game.js. -->
    <div class="grid" id="grid">
      <div class="reel" data-reel="0">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="1">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="2">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="3">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="reel" data-reel="4">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
    </div>

    <div class="controls">
      <button id="spin-button" type="button" class="spin-button">Spin</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
